<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cinema</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  /* ---------- 스플래시(메인) 화면 ---------- */
  #splash {
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at center, #1a1a1a 0%, #000 70%);
    color:#fff;
    z-index:10;
    text-align:center;
    padding:20px;
  }

  #splash .curtain { position:absolute; top:0; bottom:0; z-index:-1; overflow:hidden; }
  #splash .curtain img { width:100%; height:100%; object-fit:cover; display:block; opacity:.55; }
  #splash .curtain.left { left:0; width:16%; }
  #splash .curtain.right { right:0; width:16%; }

  #splash h1 {
    font-size:clamp(22px, 6vw, 42px);
    letter-spacing:4px;
    font-weight:300;
    margin-bottom:16px;
    text-transform:uppercase;
  }

  #splash p.sub {
    font-size:14px;
    color:#999;
    margin-bottom:50px;
    letter-spacing:2px;
  }

  #enterBtn {
    padding:16px 46px;
    font-size:16px;
    letter-spacing:3px;
    background:transparent;
    border:1px solid #fff;
    color:#fff;
    border-radius:50px;
    cursor:pointer;
    transition:all .3s ease;
    text-transform:uppercase;
  }
  #enterBtn:active { transform:scale(0.95); }
  #enterBtn:hover { background:#fff; color:#000; }

  @keyframes pulse {
    0%,100% { opacity:1; }
    50% { opacity:.5; }
  }
  #enterBtn { animation:pulse 2.2s infinite; }

  /* ---------- 카운트다운 영상 화면 ---------- */
  #countdownWrap {
    position:fixed; inset:0;
    display:none;
    background:#000;
    z-index:8;
  }
  #countdownVideo {
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  #blackFade {
    position:absolute; inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.9s ease;
    z-index:9;
  }
  #blackFade.fadeOut { opacity:1; }

  /* ---------- 영상 화면 + 커튼 ---------- */
  #videoWrap {
    position:fixed; inset:0;
    background:#000;
    display:none;
    z-index:5;
    overflow:hidden;
  }
  #player {
    width:100%; height:100%;
    border:0;
  }

  .stageCurtain {
    position:absolute; top:0; bottom:0; width:58%;
    z-index:6;
    overflow:hidden;
    transition: transform 1.6s cubic-bezier(.77,0,.18,1);
  }
  .stageCurtain img { width:100%; height:100%; object-fit:cover; display:block; }
  .stageCurtain.leftStage  { left:0;  transform:translateX(0); z-index:7; }
  .stageCurtain.rightStage { right:0; transform:translateX(0); z-index:6; }
  .stageCurtain.leftStage.open  { transform:translateX(-100%); }
  .stageCurtain.rightStage.open { transform:translateX(100%); }

  .hidden { display:none !important; }

  /* ---------- 가로 회전 안내 오버레이 ---------- */
  #rotateOverlay {
    position:fixed; inset:0;
    background:#000;
    z-index:999;
    display:none;
    flex-direction:column;
    align-items:center; justify-content:center;
    color:#fff;
    text-align:center;
    padding:30px;
  }
  @media (orientation: portrait) {
    #rotateOverlay { display:flex; }
  }
  #rotateOverlay .icon {
    font-size:56px;
    margin-bottom:20px;
    animation:rotateHint 1.6s ease-in-out infinite;
  }
  @keyframes rotateHint {
    0%, 100% { transform:rotate(0deg); }
    50% { transform:rotate(90deg); }
  }
  #rotateOverlay p {
    font-size:16px;
    letter-spacing:1px;
    color:#ddd;
  }
</style>
</head>
<body>

  <!-- 가로 회전 안내 -->
  <div id="rotateOverlay">
    <div class="icon">📱</div>
    <p>영화관 모드를 위해<br>화면을 가로로 돌려주세요</p>
  </div>

  <!-- 메인(대기) 화면 -->
  <div id="splash">
    <div class="curtain left"><img src="front_curtain.webp" alt=""></div>
    <div class="curtain right"><img src="back_curtain.webp" alt=""></div>
    <h1>지금 상영합니다</h1>
    <p class="sub">화면을 터치하여 입장하세요</p>
    <button id="enterBtn">입장하기</button>
  </div>

  <!-- 카운트다운 영상 화면 -->
  <div id="countdownWrap">
    <video id="countdownVideo" src="countdown.mp4" playsinline muted></video>
    <div id="blackFade"></div>
  </div>

  <!-- 영상(본편) 화면 -->
  <div id="videoWrap">
    <iframe id="player"
      allow="autoplay; fullscreen; encrypted-media"
      allowfullscreen
      frameborder="0"></iframe>
    <div class="stageCurtain leftStage" id="curtainLeft"><img src="front_curtain.webp" alt=""></div>
    <div class="stageCurtain rightStage" id="curtainRight"><img src="back_curtain.webp" alt=""></div>
  </div>

<script>
  // ▼▼▼ 여기에 유튜브 영상 ID만 넣으세요 ▼▼▼
  // 예: https://www.youtube.com/watch?v=dQw4w9WgXcQ  -> ID는 dQw4w9WgXcQ
  // 기본 영상 (파라미터 없이 접속했을 때 보여줄 영상)
  const DEFAULT_VIDEO_ID = "7Ih0W8NSFXs";

  // 주소 끝의 ?v=영상ID 파라미터를 읽어서 사용, 없으면 기본 영상 재생
  const urlParams = new URLSearchParams(window.location.search);
  const YOUTUBE_VIDEO_ID = urlParams.get('v') || DEFAULT_VIDEO_ID;
  // ▲▲▲ ---------------------------- ▲▲▲

  const splash = document.getElementById('splash');
  const countdownWrap = document.getElementById('countdownWrap');
  const countdownVideo = document.getElementById('countdownVideo');
  const blackFade = document.getElementById('blackFade');
  const videoWrap = document.getElementById('videoWrap');
  const player = document.getElementById('player');
  const enterBtn = document.getElementById('enterBtn');
  const curtainLeft = document.getElementById('curtainLeft');
  const curtainRight = document.getElementById('curtainRight');

  function playCountdown() {
    countdownWrap.style.display = 'block';
    countdownVideo.currentTime = 0;
    countdownVideo.muted = false; // 사용자 터치(클릭) 직후라 소리 재생 허용됨
    const p = countdownVideo.play();
    if (p && p.catch) {
      p.catch(() => {
        // 소리 재생이 막히면 무음으로라도 재생
        countdownVideo.muted = true;
        countdownVideo.play();
      });
    }
  }

  function fadeToBlackThenMovie() {
    // 카운트다운 영상 위로 검은 화면 페이드
    blackFade.classList.add('fadeOut');
    setTimeout(() => {
      // 완전히 검게 된 상태 -> 잠깐 유지 -> 영화 화면(커튼 닫힌 채)으로 전환
      setTimeout(() => {
        countdownWrap.style.display = 'none';
        startMovie();
      }, 500); // 검은 화면 유지 시간
    }, 900); // blackFade transition 시간과 일치
  }

  function startMovie() {
    videoWrap.style.display = 'block';
    // 유튜브 자동재생 삽입 (커튼 뒤에서 미리 로드)
    player.src = `https://www.youtube.com/embed/${YOUTUBE_VIDEO_ID}?autoplay=1&playsinline=1&controls=0&rel=0`;

    // 잠깐 뒤 커튼을 양옆으로 열어 영화 공개
    setTimeout(() => {
      curtainLeft.classList.add('open');
      curtainRight.classList.add('open');
    }, 500);
  }

  function enterCinema() {
    // 1) 풀스크린 요청 (사용자 터치 이벤트 '안'에서 실행되어야 브라우저가 허용함)
    const el = document.documentElement;
    const requestFS = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (requestFS) {
      requestFS.call(el).then(() => {
        // 풀스크린 진입 성공 시 가로모드 강제 시도 (안드로이드 크롬만 지원, iOS Safari는 미지원이라 무시됨)
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(()=>{ /* 지원 안 하는 브라우저는 조용히 무시 */ });
        }
      }).catch(()=>{ /* 일부 브라우저(iOS Safari)는 거부할 수 있음 */ });
    }

    // 2) 스플래시 숨기고 카운트다운 영상 재생
    splash.classList.add('hidden');
    playCountdown();
  }

  // 카운트다운 영상이 끝나면 검게 페이드 후 영화 시작
  countdownVideo.addEventListener('ended', fadeToBlackThenMovie);

  enterBtn.addEventListener('click', enterCinema);

  // 화면 전체를 터치해도 입장되게 (버튼 뿐 아니라)
  splash.addEventListener('click', enterCinema);
</script>

</body>
</html>
