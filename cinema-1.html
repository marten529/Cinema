<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cinema</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  /* ---------- 스플래시(메인) 화면 ---------- */
  #splash {
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at center, #1a1a1a 0%, #000 70%);
    color:#fff;
    z-index:10;
    text-align:center;
    padding:20px;
  }

  #splash .curtain {
    position:absolute; top:0; bottom:0; width:12%;
    background:linear-gradient(90deg,#3a0000,#7a0000,#3a0000);
    z-index:-1;
  }
  #splash .curtain.left { left:0; }
  #splash .curtain.right { right:0; }

  #splash h1 {
    font-size:clamp(22px, 6vw, 42px);
    letter-spacing:4px;
    font-weight:300;
    margin-bottom:16px;
    text-transform:uppercase;
  }

  #splash p.sub {
    font-size:14px;
    color:#999;
    margin-bottom:50px;
    letter-spacing:2px;
  }

  #enterBtn {
    padding:16px 46px;
    font-size:16px;
    letter-spacing:3px;
    background:transparent;
    border:1px solid #fff;
    color:#fff;
    border-radius:50px;
    cursor:pointer;
    transition:all .3s ease;
    text-transform:uppercase;
  }
  #enterBtn:active { transform:scale(0.95); }
  #enterBtn:hover { background:#fff; color:#000; }

  @keyframes pulse {
    0%,100% { opacity:1; }
    50% { opacity:.5; }
  }
  #enterBtn { animation:pulse 2.2s infinite; }

  /* ---------- 카운트다운 화면 ---------- */
  #countdown {
    position:fixed; inset:0;
    display:none;
    align-items:center; justify-content:center;
    background:#000;
    z-index:8;
  }
  #countdown span {
    font-size:clamp(60px, 20vw, 160px);
    color:#fff;
    font-weight:200;
    letter-spacing:4px;
  }
  #countdown span.go {
    font-size:clamp(28px, 7vw, 50px);
    letter-spacing:10px;
    text-transform:uppercase;
    color:#e50914;
    font-weight:600;
  }
  @keyframes countPop {
    0% { transform:scale(0.4); opacity:0; }
    30% { transform:scale(1.15); opacity:1; }
    100% { transform:scale(1); opacity:1; }
  }
  .countAnim { animation:countPop .5s ease-out; }

  /* ---------- 영상 화면 + 커튼 ---------- */
  #videoWrap {
    position:fixed; inset:0;
    background:#000;
    display:none;
    z-index:5;
    overflow:hidden;
  }
  #player {
    width:100%; height:100%;
    border:0;
  }

  .stageCurtain {
    position:absolute; top:0; bottom:0; width:52%;
    background:linear-gradient(90deg,#2a0000,#8a0000 40%,#5a0000);
    z-index:6;
    box-shadow: 0 0 60px rgba(0,0,0,.6) inset;
    transition: transform 1.6s cubic-bezier(.77,0,.18,1);
  }
  .stageCurtain.leftStage  { left:0;  transform:translateX(0); }
  .stageCurtain.rightStage { right:0; transform:translateX(0); }
  .stageCurtain.leftStage.open  { transform:translateX(-100%); }
  .stageCurtain.rightStage.open { transform:translateX(100%); }

  .hidden { display:none !important; }

  /* ---------- 가로 회전 안내 오버레이 ---------- */
  #rotateOverlay {
    position:fixed; inset:0;
    background:#000;
    z-index:999;
    display:none;
    flex-direction:column;
    align-items:center; justify-content:center;
    color:#fff;
    text-align:center;
    padding:30px;
  }
  @media (orientation: portrait) {
    #rotateOverlay { display:flex; }
  }
  #rotateOverlay .icon {
    font-size:56px;
    margin-bottom:20px;
    animation:rotateHint 1.6s ease-in-out infinite;
  }
  @keyframes rotateHint {
    0%, 100% { transform:rotate(0deg); }
    50% { transform:rotate(90deg); }
  }
  #rotateOverlay p {
    font-size:16px;
    letter-spacing:1px;
    color:#ddd;
  }
</style>
</head>
<body>

  <!-- 가로 회전 안내 -->
  <div id="rotateOverlay">
    <div class="icon">📱</div>
    <p>영화관 모드를 위해<br>화면을 가로로 돌려주세요</p>
  </div>

  <!-- 메인(대기) 화면 -->
  <div id="splash">
    <div class="curtain left"></div>
    <div class="curtain right"></div>
    <h1>지금 상영합니다</h1>
    <p class="sub">화면을 터치하여 입장하세요</p>
    <button id="enterBtn">입장하기</button>
  </div>

  <!-- 카운트다운 화면 -->
  <div id="countdown">
    <span id="countdownText" class="countAnim">3</span>
  </div>

  <!-- 영상 화면 -->
  <div id="videoWrap">
    <div class="stageCurtain leftStage" id="curtainLeft"></div>
    <div class="stageCurtain rightStage" id="curtainRight"></div>
    <iframe id="player"
      allow="autoplay; fullscreen; encrypted-media"
      allowfullscreen
      frameborder="0"></iframe>
  </div>

<script>
  // ▼▼▼ 여기에 유튜브 영상 ID만 넣으세요 ▼▼▼
  // 예: https://www.youtube.com/watch?v=dQw4w9WgXcQ  -> ID는 dQw4w9WgXcQ
  const YOUTUBE_VIDEO_ID = "7Ih0W8NSFXs";
  // ▲▲▲ ---------------------------- ▲▲▲

  const splash = document.getElementById('splash');
  const videoWrap = document.getElementById('videoWrap');
  const player = document.getElementById('player');
  const enterBtn = document.getElementById('enterBtn');

  const countdownEl = document.getElementById('countdown');
  const countdownText = document.getElementById('countdownText');
  const curtainLeft = document.getElementById('curtainLeft');
  const curtainRight = document.getElementById('curtainRight');

  function runCountdown() {
    const steps = ["3", "2", "1", "상영 시작"];
    let i = 0;
    countdownEl.style.display = 'flex';

    function showStep() {
      countdownText.textContent = steps[i];
      countdownText.className = steps[i] === "상영 시작" ? "go countAnim" : "countAnim";
      // 애니메이션 재시작을 위해 리플로우 강제
      void countdownText.offsetWidth;
      countdownText.classList.add('countAnim');

      i++;
      if (i < steps.length) {
        setTimeout(showStep, 800);
      } else {
        // 카운트다운 종료 -> 영상 화면(커튼 닫힌 상태)으로 전환
        setTimeout(() => {
          countdownEl.style.display = 'none';
          startVideo();
        }, 700);
      }
    }
    showStep();
  }

  function startVideo() {
    videoWrap.style.display = 'block';
    // 유튜브 자동재생 삽입 (커튼 뒤에서 미리 로드)
    player.src = `https://www.youtube.com/embed/${YOUTUBE_VIDEO_ID}?autoplay=1&playsinline=1&controls=0&rel=0`;

    // 잠깐 뒤 커튼을 양옆으로 열어 영상 공개
    setTimeout(() => {
      curtainLeft.classList.add('open');
      curtainRight.classList.add('open');
    }, 400);
  }

  function enterCinema() {
    // 1) 풀스크린 요청 (사용자 터치 이벤트 '안'에서 실행되어야 브라우저가 허용함)
    const el = document.documentElement;
    const requestFS = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (requestFS) {
      requestFS.call(el).then(() => {
        // 풀스크린 진입 성공 시 가로모드 강제 시도 (안드로이드 크롬만 지원, iOS Safari는 미지원이라 무시됨)
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(()=>{ /* 지원 안 하는 브라우저는 조용히 무시 */ });
        }
      }).catch(()=>{ /* 일부 브라우저(iOS Safari)는 거부할 수 있음 */ });
    }

    // 2) 스플래시 숨기고 카운트다운 시작
    splash.classList.add('hidden');
    runCountdown();
  }

  enterBtn.addEventListener('click', enterCinema);

  // 화면 전체를 터치해도 입장되게 (버튼 뿐 아니라)
  splash.addEventListener('click', enterCinema);
</script>

</body>
</html>
